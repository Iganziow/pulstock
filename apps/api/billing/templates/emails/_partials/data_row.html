{% comment %}Fila etiqueta/valor. Sin caja: una línea arriba y el aire hacen el trabajo.
Contexto (igual que antes):
  label str · value str|safe · is_last bool · mono bool · big bool · color str
{% endcomment %}<tr>
  <td style="padding:12px 0;border-top:1px solid #E7E4DE;{% if is_last %}border-bottom:1px solid #E7E4DE;{% endif %}font-family:'DM Sans',Helvetica,Arial,sans-serif;font-size:13.5px;color:#6C6A7D;">{{ label }}</td>
  <td align="right" style="padding:12px 0;border-top:1px solid #E7E4DE;{% if is_last %}border-bottom:1px solid #E7E4DE;{% endif %}font-family:{% if mono %}'JetBrains Mono',ui-monospace,Menlo,monospace{% else %}'DM Sans',Helvetica,Arial,sans-serif{% endif %};font-size:{% if big %}19{% elif mono %}13{% else %}14.5{% endif %}px;font-weight:{% if big %}700{% else %}400{% endif %};color:{{ color|default:'#191825' }};">{{ value|safe }}</td>
</tr>
