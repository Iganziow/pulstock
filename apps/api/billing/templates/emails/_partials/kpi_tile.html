{% comment %}Cifra destacada. Sin tarjeta: una línea superior la ancla y el número manda.
Contexto (igual que antes): label · value · sublabel · color
{% endcomment %}<td class="ps-kpi" valign="top" style="padding:0 14px 0 0;font-family:'DM Sans',Helvetica,Arial,sans-serif;border-top:2px solid #191825;padding-top:11px;">
  <div style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:9.5px;font-weight:700;letter-spacing:0.13em;text-transform:uppercase;color:#6C6A7D;">{{ label }}</div>
  <div style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:25px;font-weight:700;letter-spacing:-0.02em;color:{{ color|default:'#191825' }};padding-top:6px;line-height:1.1;">{{ value }}</div>
  <div style="font-size:12.5px;color:#6C6A7D;padding-top:4px;line-height:1.4;">{{ sublabel|default:"&nbsp;" }}</div>
</td>
