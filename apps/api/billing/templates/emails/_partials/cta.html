{% comment %}Botón. Rectángulo sólido a propósito: los bordes redondeados y los
degradados son lo primero que Outlook descarta.
Contexto: text · url · bg (opcional)
{% endcomment %}<table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:0 0 6px;"><tr>
  <td bgcolor="{{ bg|default:'#4338CA' }}" style="background:{{ bg|default:'#4338CA' }};">
    <a href="{{ url }}" style="display:block;padding:14px 28px;font-family:'DM Sans',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700;color:#FFFFFF;letter-spacing:-0.01em;">{{ text }}</a>
  </td>
</tr></table>
